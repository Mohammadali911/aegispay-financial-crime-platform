resources:
  jobs:
    aegispay_foundation_validation:
      name: AegisPay Foundation Validation
      description: Validates the deployed environment before financial-crime workloads are enabled.
      tags:
        project: aegispay
        environment: ${var.environment}
      tasks:
        - task_key: validate_foundation
          notebook_task:
            notebook_path: ../src/notebooks/00_validate_foundation.py
            base_parameters:
              catalog: ${var.catalog}
              environment: ${var.environment}
          environment_key: default
        - task_key: generate_synthetic_landing
          depends_on:
            - task_key: validate_foundation
          notebook_task:
            notebook_path: ../src/notebooks/01_generate_synthetic_landing.py
            base_parameters:
              catalog: ${var.catalog}
              environment: ${var.environment}
              payment_event_count: "1000"
              customer_change_count: "200"
              authentication_event_count: "500"
              device_event_count: "500"
              access_event_count: "200"
          environment_key: default
        - task_key: refresh_bronze_pipeline
          depends_on:
            - task_key: generate_synthetic_landing
          pipeline_task:
            pipeline_id: ${resources.pipelines.aegispay_bronze.id}
            full_refresh: false
        - task_key: refresh_silver_pipeline
          depends_on:
            - task_key: refresh_bronze_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.aegispay_silver.id}
            full_refresh: false
        - task_key: refresh_gold_pipeline
          depends_on:
            - task_key: refresh_silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.aegispay_gold.id}
            full_refresh: false
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
